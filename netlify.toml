# Headers only — build/publish is handled automatically by @netlify/plugin-nextjs.
# (A previous [build]/publish block broke the deploy, so it is intentionally omitted.)

# Hashed Next.js build assets — immutable, cache for a year.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static brand imagery in /public/img — long cache, revalidate in background.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
